<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Playground — dočasně nedostupné</title>
  <style>
    :root { color-scheme: light; --bg:#ffffff; --panel:#ffffff; --text:#111111; --muted:#444444; --accent:#111111; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color:var(--text); background:var(--bg); }
    .card { width:min(100%, 620px); text-align:center; padding:clamp(30px, 7vw, 60px) clamp(22px, 5vw, 48px); border:1px solid #e5e5e5; border-radius:18px; background:var(--panel); box-shadow:0 8px 30px rgba(0,0,0,.06); }
    .mark { width:76px; height:76px; margin:0 auto 25px; display:grid; place-items:center; border-radius:24px; background:#111111; color:#ffffff; font-size:36px; }
    .eyebrow { margin:0 0 12px; color:#333333; font-size:.78rem; font-weight:750; letter-spacing:.16em; text-transform:uppercase; }
    h1 { margin:0; font-size:clamp(2rem, 6vw, 3.15rem); line-height:1.08; letter-spacing:-.045em; }
    .message { margin:20px auto 0; max-width:430px; color:var(--muted); font-size:clamp(1rem, 2.5vw, 1.15rem); line-height:1.7; }
    .status { display:inline-flex; align-items:center; gap:10px; margin-top:30px; padding:11px 16px; border:1px solid rgba(255,255,255,.1); border-radius:999px; color:#111111; background:#f7f7f7; border-color:#dddddd; font-size:.9rem; }
    .dot { width:8px; height:8px; border-radius:50%; background:#ffca65; box-shadow:0 0 0 5px rgba(255,202,101,.12); animation:pulse 1.8s infinite; }
    footer { margin-top:34px; color:#555555; font-size:.8rem; }
    @keyframes pulse { 50% { opacity:.45; } }
    @media (prefers-reduced-motion: reduce) { .dot { animation:none; } }
  </style>
</head>
<body>
  <main class="card" role="main" aria-labelledby="headline">
    <div class="mark" aria-hidden="true">P</div>
    <p class="eyebrow">Playground · Technické oznámení</p>
    <h1 id="headline">Playground je dočasně nedostupné.</h1>
    <p class="message">Náš technický tým pracuje na odstranění problému. Omlouváme se za komplikace a děkujeme za trpělivost.</p>
    <div class="status"><span class="dot" aria-hidden="true"></span> Na opravě se pracuje</div>
    <footer>Děkujeme, že máte trpělivost. 💜</footer>
  </main>
</body>
</html>
